# ==============================================================================
# Docker Compose Specification for IBM LinuxONE (s390x) & x86_64
# Real-Time Insurance Claim Risk Scoring Platform - IBM Z Datathon 2026
# Compatible with Docker Compose & Podman Compose (Podman 5.x)
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: insura-backend:1.0.0
    container_name: insura-backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:////app/data/claims.db
      - MODEL_ARTIFACT_PATH=backend/models/risk_model.joblib
      - MODEL_METADATA_PATH=backend/models/metadata.json
      - ALLOW_MOCK_MODEL=false
      - CORS_ORIGINS=*
    volumes:
      - claim_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - insura-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: insura-frontend:1.0.0
    container_name: insura-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Port 8080 allows unprivileged / non-root users (like linux1) to bind safely
      - "8080:80"
    networks:
      - insura-net

networks:
  insura-net:
    driver: bridge

volumes:
  claim_data:
    driver: local
